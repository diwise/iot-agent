# Unified iot-agent configuration with 2 top sections.
#
# - `deviceprofiles` styr auto-create (codec -> profil/tenant/tags).
#   Tom som default, samma beteende som gamla deviceprofiles.yaml-mallen.
#   Exempel:
#   deviceprofiles:
#     Elsys_Codec:
#       profile_name: elsys
#       tenant: default
#       activate: true
#       location: true
#       tags: {enabled: true, metadata: true}
# - `decoders` styr Go/JS-decoders + LWM2M-regler (kräver schemaVersion: 1).
#   Qalcosonic tar ingen YAML-post (explicit legacy-undantag).
# Ändringar kräver omstart. Leverera agent + denna fil + script som matchande uppsättning.
# Rollback är föregående agent + matchande fil.
schemaVersion: 1
deviceprofiles: {}
decoders:
  airquality:
    go: airquality
    groups:
      humidity:
        urn: urn:oma:lwm2m:ext:3304
      temp:
        urn: urn:oma:lwm2m:ext:3303
      air:
        urn: urn:oma:lwm2m:ext:3428
    rules:
      - id: h
        from: humidity
        group: humidity
        resource: "5700"
      - id: t
        from: temperature
        group: temp
        resource: "5700"
      - id: pm10
        from: pm10
        group: air
        resource: "1"
      - id: pm25
        from: pm25
        group: air
        resource: "3"
      - id: no2
        from: no2
        group: air
        resource: "15"
  axsensor:
    go: axsensor
    groups:
      distance:
        urn: urn:oma:lwm2m:ext:3330
      filling:
        urn: urn:oma:lwm2m:ext:3435
      pressure:
        urn: urn:oma:lwm2m:ext:3323
      humidity:
        urn: urn:oma:lwm2m:ext:3304
      temp:
        urn: urn:oma:lwm2m:ext:3303
      device:
        urn: urn:oma:lwm2m:ext:3
    rules:
      - id: d
        from: distance_m
        group: distance
        resource: "5700"
      - id: lp
        from: level_percent
        group: filling
        resource: "2"
      - id: lc
        from: level_cm
        group: filling
        resource: "3"
      - id: pr
        from: pressure
        group: pressure
        resource: "5700"
      - id: h
        from: relativeHumidity
        group: humidity
        resource: "5700"
      - id: t
        from: temperature
        group: temp
        resource: "5700"
      - id: v
        from: vbat
        group: device
        resource: "7"
  enviot:
    go: enviot
    input: object
    status:
      battery:
        path: payload.battery
        transforms:
          - name: to_int
    groups:
      temp:
        urn: urn:oma:lwm2m:ext:3303
      humidity:
        urn: urn:oma:lwm2m:ext:3304
      device:
        urn: urn:oma:lwm2m:ext:3
      distance:
        urn: urn:oma:lwm2m:ext:3330
    rules:
      - id: t
        from: payload.temperature
        group: temp
        resource: "5700"
      - id: h
        from: payload.humidity
        group: humidity
        resource: "5700"
      - id: b
        from: payload.battery
        group: device
        resource: "9"
        transforms:
          - name: to_int
      - id: s
        from: payload.snowHeight
        group: distance
        resource: "5700"
      - id: apptype
        group: distance
        resource: "5750"
        const: SnowHeight
