  elt_2_hp:
    go: elt_2_hp
    status:
      battery:
        path: vdd
        transforms:
          - name: vdd_to_soc
    groups:
      temp-in:
        urn: urn:oma:lwm2m:ext:3303
        strategy: elsys
        role: internal
      temp-ext1:
        urn: urn:oma:lwm2m:ext:3303
        strategy: elsys
        role: extern1
      temp-ext2:
        urn: urn:oma:lwm2m:ext:3303
