      air:
        urn: urn:oma:lwm2m:ext:3428
      device:
        urn: urn:oma:lwm2m:ext:3
      presence:
        urn: urn:oma:lwm2m:ext:3302
      loudness:
        urn: urn:oma:lwm2m:ext:3324
      digital:
        urn: urn:oma:lwm2m:ext:3200
    rules:
      - id: t
        from: temperature
        group: temp-in
        resource: "5700"
      - id: e1
        from: externalTemperature
        group: temp-ext1
        resource: "5700"
      - id: e2
        from: externalTemperature2
        group: temp-ext2
        resource: "5700"
      - id: h
        from: humidity
        group: humidity
        resource: "5700"
      - id: l
        from: light
        group: light
        resource: "5700"
      - id: c
        from: co2
        group: air
        resource: "17"
      - id: v
        from: vdd
        group: device
        resource: "7"
      - id: b
        from: vdd
        group: device
        resource: "9"
        transforms:
          - name: vdd_to_soc
      - id: o
        from: occupancy
        group: presence
        resource: "5500"
        transforms:
          - name: equals
            params:
              value: 2
      - id: sa
        from: soundAvg
        aliases: [soundPeak]
        group: loudness
        resource: "5700"
      - id: sp
        from: soundPeak
        group: loudness
        resource: "5602"
      - id: d
        from: digital
        group: digital
        resource: "5500"
      - id: pa
        from: pulseAbs
        group: digital
        resource: "5501"
